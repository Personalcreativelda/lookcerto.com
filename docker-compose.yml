version: '3.8'

services:
  lookcerto-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_KEY=${API_KEY}
        - S3_ENDPOINT=${S3_ENDPOINT}
        - S3_REGION=${S3_REGION}
        - S3_ACCESS_KEY=${S3_ACCESS_KEY}
        - S3_SECRET_KEY=${S3_SECRET_KEY}
        - S3_BUCKET_NAME=${S3_BUCKET_NAME}
        - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
    container_name: lookcerto_production
    ports:
      - "3030:80"
    environment:
      - NODE_ENV=production
      - API_KEY=${API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
    restart: always
    networks:
      - lookcerto-network

networks:
  lookcerto-network:
    driver: bridge
